<!doctype html><meta charset="utf-8"><style>[hidden]{display:none!important}body{font:16px sans-serif}img{width:200px;height:120px}[contenteditable]{white-space:pre-wrap;min-height:80px;border:1px solid}</style>
<body><main></main><script>
const root=document.querySelector('main');let current=null;let mode='video';const read=()=>JSON.parse(localStorage.getItem('drafts')||'[]');
function write(d){localStorage.setItem('drafts',JSON.stringify(d))}
function save(){if(!current)return;current.title=document.querySelector('input[placeholder]').value;current.body=document.querySelector('[contenteditable]').innerText;const all=read();let i=all.findIndex(x=>x.id===current.id);if(i<0)all.push(current);else all[i]=current;write(all)}
function editor(d){current=d;root.innerHTML='<span>1/18</span><img id="creator-preview-image-0" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+a9XsAAAAASUVORK5CYII="><input placeholder="填写标题会有更多赞哦"><div contenteditable="true"></div><div id="ai"></div><button id="save">暂存离开</button><button id="publish">发布</button>';document.querySelector('input').value=d.title;document.querySelector('[contenteditable]').innerText=d.body;root.oninput=save;showAI();document.querySelector('#save').onclick=()=>{save();home()};document.querySelector('#publish').onclick=()=>{localStorage.setItem('published',Number(localStorage.getItem('published')||0)+1);fetch('/api/sns/web/v1/publish',{method:'POST'})};}
function showAI(){const el=document.querySelector('#ai');el.innerHTML=current.ai?'<span>笔记含AI合成内容</span>':'<button>添加内容类型声明</button>';if(!current.ai)el.querySelector('button').onclick=()=>{el.innerHTML='<button>笔记含AI合成内容</button>';el.querySelector('button').onclick=()=>{current.ai=true;save();showAI()}}}
function list(){const all=read();root.innerHTML='<button id="entry">草稿箱('+all.length+')</button><button id="images">图文笔记('+all.length+')</button><p id="local">草稿存储于当前使用的浏览器本地；视频笔记最多支持100篇</p><section></section>';document.querySelector('#images').onclick=()=>{document.querySelector('#local').textContent='草稿存储于当前使用的浏览器本地；图文笔记最多支持100篇';const section=document.querySelector('section');all.forEach(d=>{const row=document.createElement('div');row.className='draft-info';const title=document.createElement('div');title.className='draft-title-text';title.textContent=d.title;const edit=document.createElement('button');edit.textContent='编辑';edit.onclick=()=>editor(d);row.append(title,edit);section.append(row)})}}
function home(){current=null;const n=read().length;root.innerHTML='<button id="entry">草稿箱('+n+')</button><input type="file" accept="image/png">';document.querySelector('#entry').onclick=list;document.querySelector('input').onchange=()=>{localStorage.setItem('uploads',Number(localStorage.getItem('uploads')||0)+1);editor({id:Date.now().toString(),title:'',body:'',ai:false})}}
home();
</script>
